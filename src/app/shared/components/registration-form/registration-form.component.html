<h2 class="text-align-center">Registration</h2>
<div class="app-plate">
  <form
    #registrationForm="ngForm"
    (ngSubmit)="onSubmit()"
    class="registration-form"
  >
    <div>
      <div class="form__control">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          placeholder="Input text"
          name="name"
          required
          minlength="6"
          ngModel
          #name="ngModel"
        />
        <span
          *ngIf="name.invalid && (name.touched || registrationForm.submitted)"
          id="nameErrorMessage"
          class="text-danger"
        >
          <ng-container *ngIf="name.errors?.['minlength']"
            >Name must be at least 6 characters long.</ng-container
          >
          <ng-container *ngIf="name.errors?.['required']">
            Name is required.</ng-container
          >
        </span>
      </div>
      <div class="form__control">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          placeholder="Input text"
          name="email"
          required
          ngModel
          #email="ngModel"
          emailValidator
        />
        <span
          *ngIf="email.invalid && (email.touched || registrationForm.submitted)"
          id="emailErrorMessage"
          class="text-danger"
        >
          <ng-container *ngIf="email.errors?.['required']">
            Email is required.</ng-container
          >
          <ng-container *ngIf="email.errors?.['invalidEmail']"
            >Invalid email format.</ng-container
          ></span
        >
      </div>
      <div class="form__control">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Input text"
          name="password"
          required
          minlength="6"
          ngModel
          #password="ngModel"
        />
        <span
          id="passwordErrorMessage"
          class="text-danger"
          *ngIf="
            password.invalid && (password.touched || registrationForm.submitted)
          "
          >Password is required.</span
        >
      </div>
    </div>
    <div class="form__action">
      <app-button type="submit" buttonText="REGISTER"></app-button>
    </div>
    <div class="form__text">
      If you have an account you may <strong><a href="/login">Login</a></strong>
    </div>
  </form>
</div>
